name: Experimental LiveContainer auth build

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.4'
      - name: Install build tools
        run: brew install ldid xcbeautify
      - name: Check out pinned compatible SideStore and apply auth-only changes
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/LiveContainer/SideStore.git source
          cd source
          git checkout 12a496ca1c766a102193634879823d16610bf1cd
          git submodule update --init --recursive
          test "$(git -C Dependencies/SideSign rev-parse HEAD)" = df2b8e4257454f0c7629276d409d6e9d7953fdf6
          echo '' | base64 --decode > ../sidestore-auth.patch
          echo '' | base64 --decode > ../sidesign-auth.patch
          git apply --check ../sidestore-auth.patch
          git apply ../sidestore-auth.patch
          cd Dependencies/SideSign
          git apply --check ../../../sidesign-auth.patch
          git apply ../../../sidesign-auth.patch
          git diff --check
      - name: Pre-populate upstream binary artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          curl --retry 3 -fsSL https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip -o "$ARTIFACTS_DIR/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          curl --retry 3 -fsSL https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/Unicorn.xcframework.zip -o "$ARTIFACTS_DIR/https___github_com_mahee96_unicorn_releases_download_2_1_4_multiarch_Unicorn_xcframework_zip"
      - name: Compile patched SideStore
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          make -B build 2>&1 | tee ../build.log | xcbeautify
          make fakesign
          make ipa
      - name: Package with official LiveContainer host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined out
          curl --retry 3 -fsSL 'https://github.com/LiveContainer/LiveContainer/releases/download/nightly/LiveContainer%2BSideStore.ipa' -o official-combined.ipa
          shasum -a 256 official-combined.ipa > out/PROVENANCE.txt
          curl --retry 3 -fsSL https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify -o dylibify
          chmod +x dylibify
          curl --retry 3 -fsSL https://raw.githubusercontent.com/LiveContainer/LiveContainer/4dbe0f9a626de801184a42c0be8d2cb105058e3d/.github/sidelc/LiveWidgetExtension_adhoc.xml -o widget-entitlements.plist
          ditto -x -k official-combined.ipa combined
          ditto -x -k source/SideStore.ipa patched
          python3 - <<'PY'
          import pathlib, plistlib, shutil, subprocess
          app = pathlib.Path('combined/Payload/LiveContainer.app')
          framework = app / 'Frameworks/SideStoreApp.framework'
          assert (app / 'Frameworks/SideStoreSupport.framework').is_dir()
          host = plistlib.loads((app / 'Info.plist').read_bytes())
          assert host['CFBundleIdentifier'] == 'com.kdt.livecontainer', host
          old_lc_info = (framework / 'LCAppInfo.plist').read_bytes()
          shutil.rmtree(framework)
          shutil.copytree('patched/Payload/SideStore.app', framework, symlinks=True)
          (framework / 'LCAppInfo.plist').write_bytes(old_lc_info)
          ss_info = plistlib.loads((framework / 'Info.plist').read_bytes())
          ss_info['CFBundleVersion'] = '20261015.3'
          ss_info['LCAuthFixRevision'] = '3-pushed-verification-code'
          (framework / 'Info.plist').write_bytes(plistlib.dumps(ss_info))
          binary = framework / 'SideStore'
          subprocess.run(['./dylibify', str(binary), str(binary)+'.dylib'], check=True)
          binary.unlink()
          pathlib.Path(str(binary)+'.dylib').rename(binary)
          subprocess.run(['ldid', '-S', str(binary)], check=True)
          headers = subprocess.check_output(['otool', '-hv', str(binary)], text=True)
          assert 'DYLIB' in headers, headers
          for name in ['Intents.intentdefinition', 'ViewApp.intentdefinition']:
              shutil.copy2(framework / name, app / name)
          meta = app / 'Metadata.appintents'
          if meta.exists(): shutil.rmtree(meta)
          shutil.copytree(framework / 'Metadata.appintents', meta)
          actions = meta / 'extract.actionsdata'
          data = actions.read_bytes()
          data = data.replace(b'9SideStore20RefreshAllAppsIntentV', b'16SideStoreSupport20RefreshAllAppsIntentV')
          data = data.replace(b'9SideStore26RefreshAllAppsWidgetIntentV', b'16SideStoreSupport26RefreshAllAppsWidgetIntentV')
          actions.write_bytes(data)
          widget = app / 'PlugIns/LiveWidgetExtension.appex'
          if widget.exists(): shutil.rmtree(widget)
          widget.parent.mkdir(exist_ok=True)
          shutil.move(str(framework / 'PlugIns/AltWidgetExtension.appex'), widget)
          info = plistlib.loads((widget / 'Info.plist').read_bytes())
          info['CFBundleIdentifier'] = 'com.kdt.livecontainer.LiveWidget'
          info['CFBundleExecutable'] = 'LiveWidgetExtension'
          (widget / 'Info.plist').write_bytes(plistlib.dumps(info))
          (widget / 'AltWidgetExtension').rename(widget / 'LiveWidgetExtension')
          for sig in list(app.rglob('_CodeSignature')):
              if sig.is_dir(): shutil.rmtree(sig)
          subprocess.run(['ldid', '-Swidget-entitlements.plist', str(widget / 'LiveWidgetExtension')], check=True)
          print('Verified original LiveContainer bundle identifier, support framework, and patched SideStore dylib.')
          PY
          cd combined
          zip -qry ../out/LiveContainer+SideStore-AuthFix-v3.ipa Payload -x '*/.DS_Store' '*/._*'
          cd ..
          printf '\nSideStore base: 12a496ca1c766a102193634879823d16610bf1cd\nSideSign base: df2b8e4257454f0c7629276d409d6e9d7953fdf6\nAuthentication changes adapted from SideStore PR 1660 (5aef228c1f8fe3bb154f39f06c5dad9e9938f3ea)\nExperimental custom build; device sign-in is not verified by compilation.\n' >> out/PROVENANCE.txt
          shasum -a 256 out/*.ipa >> out/PROVENANCE.txt
          cp sidestore-auth.patch sidesign-auth.patch out/
          cp source/LICENSE out/SideStore-LICENSE
          curl -fsSL https://raw.githubusercontent.com/LiveContainer/LiveContainer/4dbe0f9a626de801184a42c0be8d2cb105058e3d/LICENSE -o out/LiveContainer-LICENSE
      - name: Upload installable IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-AuthFix-v3
          path: out/
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
